# Pages CMS configuration (https://pagescms.org/docs/configuration/).
# This file tells Pages CMS which forms to show. It only edits files in /content and photos in
# /public/uploads. It cannot change the website's code.
#
# STATUS: written from the published Pages CMS documentation. It has NOT yet been opened in the live
# Pages CMS app (that needs the owner's GitHub login). Cowork task C17 does that first test.
#
# Every save in the CMS is a commit to GitHub. A save does NOT change the live website: it is only
# "Saved". The site is "Published" when the owner presses Netlify's Deploys > Trigger deploy > Deploy
# site (see netlify.toml and docs/buyer/CMS-SETUP.md). The build then checks the content
# (scripts/build-content.mjs); if something is wrong the build stops and the live site stays as it was.
# Pages CMS also reads its configuration per branch and has repository "Actions" buttons; a branch plus
# "Publish site" button route is PROPOSED, not active (docs/editorial-reset/PUBLISHING-WORKFLOW-
# RECOMMENDATION.md, docs/editorial-reset/proposed/). Commit messages stay at their defaults.
# IMAGES: use the Images form only (it records alt text, source and licence). Pages CMS writes JSON with
# 2-space indent and no final newline; the content build understands and tidies that layout.

# Keep any setting in a file that this form doesn't know about, instead of deleting it on save.
settings:
  content:
    merge: true

# Photos you upload are saved here and appear on the site at /uploads/<file name>.
media:
  input: public/uploads
  output: /uploads
  categories: [image]

content:
  # ---------------------------------------------------------------- Articles
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    format: json
    filename: "{primary}.json"
    exclude: [".gitkeep"]
    view:
      fields: [title, category, status, publishedAt]
      primary: title
      sort: [publishedAt, title]
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: slug
        label: Web address name
        type: string
        required: true
        description: "Lowercase words joined by hyphens, e.g. how-to-start-crocheting. It becomes the address (/journal/your-name). Never change it after the article is published, or old links and Google results will break."
      - name: title
        label: Title
        type: string
        required: true
      - name: titleItalic
        label: Words in the title to show in italics (optional)
        type: string
        description: "Copy a phrase exactly as it appears in the title, e.g. Instead of Scrolling."
      - name: dek
        label: One-sentence summary (shown under the title)
        type: text
        required: true
      - name: category
        label: Section of the site
        type: select
        required: true
        options:
          values:
            - { value: after-hours, label: "After Hours (weeknights)" }
            - { value: weekends, label: "The Weekend Edit" }
            - { value: solo-dates, label: "Solo Dates" }
            - { value: better-together, label: "Better Together" }
            - { value: creative-corner, label: "Creative Corner" }
            - { value: movement, label: "Movement" }
      - name: status
        label: Status
        type: select
        required: true
        description: "Keep on Draft while you write: a draft is never shown on the website. Switch to Published when it is finished, checked and the dates below are filled in."
        options:
          values:
            - { value: draft, label: "Draft (not on the website)" }
            - { value: published, label: "Published (live after you press Publish in Netlify)" }
      - name: publishedAt
        label: First published on
        type: string
        description: "Required for a published article. Write the date like 2026-11-19 (year-month-day). Leave empty for a draft."
      - name: updatedAt
        label: Last updated on (optional)
        type: string
        description: "Write the date like 2026-11-19. Fill in whenever you make a real change to the facts."
      - name: verifiedAt
        label: Facts last checked on
        type: string
        description: "The day every claim in the checklist below was checked against its source. Write it like 2026-11-19. Publish only after this is set."
      - name: hero
        label: Top picture
        type: reference
        required: true
        description: "Choose a picture from the Images section. Add new pictures there first."
        options:
          collection: images
          search: "key,alt"
          value: "{fields.key}"
          label: "{fields.key}: {fields.alt}"
      - name: searchIntent
        label: What people search for to find this
        type: string
        required: true
        description: "A few words, e.g. things to do after work / what to do instead of scrolling."
      - name: angle
        label: What makes this article different (for the writer)
        type: text
        required: true
      - name: hobbies
        label: Hobbies this article is about
        type: string
        list: true
        description: "The web-address names of hobbies (e.g. watercolor-painting, pickleball), one per line. Used for related reading and shop picks."
      - name: sources
        label: Sources (where the facts came from)
        type: object
        list: true
        description: "Pages you checked. Add one for every price, rule, safety or availability claim."
        fields:
          - { name: title, label: Page name, type: string, required: true }
          - { name: url, label: "Web address (starts with https://)", type: string, required: true }
          - { name: note, label: "Note, e.g. date you checked it (optional)", type: string }
      - name: coworkChecks
        label: Facts still waiting to be checked
        type: string
        list: true
        description: "Prices, rules or claims that still need a source. Empty this list before you publish."
      - name: related
        label: Related articles (shown at the end)
        type: reference
        options:
          collection: articles
          multiple: true
          search: "title,slug"
          value: "{fields.slug}"
          label: "{fields.title}"
        description: "Optional. Similar articles are also suggested automatically."
      - name: body
        label: Article content
        type: block
        list: true
        blockKey: type
        description: "Add blocks one after another. Text boxes accept **bold** and links written like [link words](/journal/another-article)."
        blocks:
          - name: p
            label: Paragraph
            fields:
              - { name: text, label: Text, type: text, required: true }
          - name: h2
            label: Big heading
            fields:
              - { name: text, label: Heading, type: string, required: true }
              - { name: id, label: "Jump-link name (optional)", type: string, description: "Lowercase words with hyphens. Adds this heading to the table of contents." }
          - name: h3
            label: Small heading
            fields:
              - { name: text, label: Heading, type: string, required: true }
          - name: list
            label: Bullet list
            fields:
              - { name: items, label: Items, type: string, list: true, required: true }
          - name: quote
            label: Quote
            fields:
              - { name: text, label: Quote, type: text, required: true }
          - name: image
            label: Picture
            fields:
              - name: image
                label: Picture
                type: reference
                required: true
                options:
                  collection: images
                  search: "key,alt"
                  value: "{fields.key}"
                  label: "{fields.key}: {fields.alt}"
              - { name: caption, label: "Caption (optional)", type: string }
          - name: item
            label: Idea or activity (numbered entry)
            fields:
              - { name: n, label: "Number (optional)", type: number }
              - { name: title, label: Name of the idea, type: string, required: true }
              - { name: note, label: What to do and why, type: text, required: true }
              - { name: time, label: "How long (e.g. 30-60 min)", type: string }
              - { name: cost, label: "Cost (e.g. Under $25)", type: string }
              - { name: company, label: "Solo or with others", type: string }
              - { name: first, label: "First step (optional)", type: string }
              - { name: hobby, label: "Hobby it links to (web-address name, optional)", type: string }
          - name: whatYoullNeed
            label: "What you'll need"
            fields:
              - { name: essentials, label: "The essentials (one per line)", type: string, list: true, required: true }
              - { name: optional, label: "Nice to have (one per line)", type: string, list: true }
          - name: saveSplurge
            label: Save or splurge
            fields:
              - { name: save, label: Where to save, type: text, required: true }
              - { name: splurge, label: Where to splurge, type: text, required: true }
          - name: tryThisWeekend
            label: "Try this weekend box"
            fields:
              - { name: text, label: Text, type: text, required: true }
          - name: girlsNight
            label: "Girls' night box"
            fields:
              - { name: text, label: Text, type: text, required: true }
          - name: first30
            label: "Your first 30 minutes (steps)"
            fields:
              - { name: steps, label: "Steps (one per line)", type: string, list: true, required: true }
          - name: noSpend
            label: "No-spend version box"
            fields:
              - { name: text, label: Text, type: text, required: true }
          - name: makePlan
            label: "Make a plan box"
            fields:
              - { name: text, label: Text, type: text, required: true }
          - name: ifYouLoved
            label: "If you loved this (hobby links)"
            fields:
              - { name: hobbies, label: "Hobbies (web-address names, one per line)", type: string, list: true, required: true }
          - name: starterKit
            label: Starter kit (shop)
            fields:
              - { name: hobbies, label: "Hobbies whose products to show (web-address names, one per line)", type: string, list: true }
              - { name: title, label: "Heading (optional)", type: string }
          - name: shopHobby
            label: Shop for a hobby
            fields:
              - { name: hobbies, label: "Hobbies whose products to show (web-address names, one per line)", type: string, list: true }
              - { name: title, label: "Heading (optional)", type: string }
              - { name: dek, label: "Short intro (optional)", type: string }
          - name: shopTheArticle
            label: "Shop this article (verified products)"
            description: "Shows nothing until the shop has verified products for it."
            fields:
              - { name: articleSlug, label: "Article name (optional)", type: string }
              - { name: hobbies, label: "Hobbies (optional, one per line)", type: string, list: true }
              - { name: collection, label: "Collection (optional)", type: string }
              - { name: title, label: "Heading (optional)", type: string }
              - { name: dek, label: "Short intro (optional)", type: string }
          - name: shopMyHobby
            label: "Shopping checklist for one hobby"
            fields:
              - { name: hobby, label: "Hobby (web-address name)", type: string, required: true }
              - { name: title, label: "Heading (optional)", type: string }
              - { name: dek, label: "Short intro (optional)", type: string }

  # ---------------------------------------------------------------- Images
  - name: images
    label: Images
    type: collection
    path: content/images
    format: json
    filename: "{primary}.json"
    exclude: [".gitkeep"]
    view:
      fields: [key, alt]
      primary: key
    fields:
      - name: key
        label: Picture name
        type: string
        required: true
        description: "One word, no spaces, letters and numbers only, e.g. crochetHands. This is the name you pick in an article. Never change it once an article uses it."
      - name: file
        label: Photo
        type: image
        required: true
        description: "Upload a JPG, PNG or WebP photo about 1600 pixels wide and under 400 KB. Only use photos you have the right to publish."
      - name: alt
        label: Describe the photo (required)
        type: text
        required: true
        description: "One sentence for people who cannot see it, e.g. A woman crocheting a yellow blanket on a sofa. At least 20 characters. No brand names."
      - { name: credit, label: "Photographer or creator (if any)", type: string }
      - { name: source, label: "Where it came from (e.g. Unsplash, my own photo)", type: string }
      - { name: sourceUrl, label: "Link to the photo's page", type: string }
      - { name: license, label: "Licence (e.g. Unsplash License)", type: string }
      - { name: licenseUrl, label: "Link to the licence terms", type: string }

  # ---------------------------------------------------------------- Site settings
  # ONE file, content/settings.json. Public values only (no passwords, API keys or private tokens).
  # The build checks every value (scripts/build-content.mjs) and stops with a plain-English message if
  # one is wrong, so the live site stays as it was.
  - name: settings
    label: Site settings
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: siteName
        label: Site name
        type: string
        required: true
        description: "Shown in the header, page titles, the footer and when the site is installed on a phone. The logo pictures and Pinterest pin images are artwork and do not change."
      - name: tagline
        label: Tagline
        type: string
        required: true
        description: "One short line under the site name."
      - name: siteUrl
        label: Website address
        type: string
        required: true
        description: "Starts with https:// and has nothing after the domain, e.g. https://www.example.com. Change it only after the domain is connected in Netlify."
      - name: contactEmail
        label: Contact email
        type: string
        description: "Shown on the Contact page. Use an inbox you really read, like hello@yourdomain.com. Leave empty and the page says there is no inbox yet."
      - name: ga4MeasurementId
        label: Google Analytics 4 measurement ID
        type: string
        description: "Looks like G-ABC123XYZ9. EMPTY = analytics is OFF and no Google script loads. See docs/buyer/ANALYTICS-SETUP.md."
      - name: searchConsoleVerification
        label: Google Search Console verification code
        type: string
        description: "Only the code (the content=\"...\" part), not the whole tag. Empty = none."
      - name: bingVerification
        label: Bing Webmaster verification code
        type: string
        description: "Only the code, not the whole tag. Empty = none."
      - name: pinterestVerification
        label: Pinterest verification code
        type: string
        description: "Only the code, not the whole tag. Empty = none."
      - name: amazonTrackingId
        label: Amazon Associates tracking ID (your own)
        type: string
        description: "Looks like yourstore-20. This is a public value that appears in link addresses. Never type a password or key here. Typing an ID does NOT switch tracking on."
      - name: amazonMarketplace
        label: Amazon marketplace
        type: select
        default: amazon.com
        options:
          values:
            - { value: amazon.com, label: "Amazon.com (United States)" }
        description: "Only Amazon.com (United States) is supported today."
      - name: amazonTrackingEnabled
        label: Switch Amazon affiliate tracking ON
        type: boolean
        default: false
        description: "Leave OFF until Amazon has approved YOUR Associates account for this website and you have read docs/buyer/AFFILIATE-ACTIVATION.md. Turning it on adds your ID to Amazon links and shows the earnings disclosure automatically."
      - name: amazonLastVerified
        label: Date you last confirmed your Amazon approval
        type: string
        description: "Like 2026-11-19. Required when tracking is ON."

  # ---------------------------------------------------------------- Products
  # ONE file per product in content/products. Every article, hobby page, shop collection, starter kit
  # and planner suggestion reads these files, so changing one here changes it everywhere. The build
  # (scripts/build-content.mjs) checks the whole set; if a product that an article mentions is held,
  # discontinued, missing or replaced in a circle, the build stops with a plain message and the live
  # site stays as it was. Never type a tracking ID anywhere here: the site adds it to every Amazon link.
  - name: products
    label: Products
    type: collection
    path: content/products
    format: json
    filename: "{primary}.json"
    exclude: [".gitkeep"]
    view:
      fields: [name, brand, status, linkType, category]
      primary: id
      sort: [order, id]
      default:
        sort: order
        order: asc
    fields:
      - name: id
        label: Product id (never changes)
        type: string
        required: true
        description: "A short, permanent name in lowercase words joined by hyphens, like junk-journal-glue. It must match the file name. Articles refer to the product by this id, so NEVER change it. To replace a product, change its Amazon number and name below (the id stays), or add a new product and set Replaced by on the old one."
      - name: name
        label: Exact name on the listing
        type: string
        required: true
      - { name: brand, label: "Brand", type: string, required: true }
      - { name: category, label: "What kind of product it is (e.g. Washi tape)", type: string, required: true }
      - { name: shortName, label: "Short name for cards (optional, under 70 letters)", type: string }
      - name: status
        label: Status
        type: select
        required: true
        description: "Candidate = researched, not shown. Verified = shown on the site. Held = approved but hidden for now (say why below). Discontinued = no longer sold or recommended (say why, and ideally pick the product that replaces it)."
        options:
          values:
            - { value: candidate, label: "Candidate (not shown)" }
            - { value: verified, label: "Verified (shown)" }
            - { value: held, label: "Held (hidden for now)" }
            - { value: discontinued, label: "Discontinued (no longer sold)" }
      - { name: statusReason, label: "Why held or discontinued (one sentence; stays private)", type: string }
      - { name: replacedBy, label: "Replaced by (the id of the product that takes over; only for held or discontinued)", type: string }
      - { name: asin, label: "Amazon number (ASIN): 10 letters and numbers from the product's Amazon page (required: every shown product is an Amazon product)", type: string, required: true }
      - { name: manufacturerUrl, label: "Maker's web address (research only; never used as a Buy link)", type: string }
      - { name: altRetailerUrl, label: "Another shop's web address (research only; never used as a Buy link)", type: string }
      - name: availability
        label: Availability
        type: select
        options:
          values:
            - { value: available, label: "Available" }
            - { value: check-listing, label: "Check the listing (availability varies)" }
            - { value: unavailable, label: "Unavailable" }
      - { name: lastVerified, label: "Date you last checked the listing and facts (like 2026-11-19)", type: string, required: true }
      - { name: order, label: "Order (lower numbers first; breaks ties for which product leads)", type: number }
      - { name: description, label: "One neutral sentence about what it is", type: text, required: true }
      - { name: whySelected, label: "Why we picked it (honest, specific)", type: text, required: true }
      - { name: audience, label: "Who it suits", type: string, required: true }
      - { name: benefit, label: "One practical line for the card (optional, under 140 letters)", type: string }
      - { name: compare, label: "If it is an alternative: how it differs (optional)", type: string }
      - { name: limitations, label: "Honest downsides (one per line, at least one)", type: string, list: true, required: true }
      - name: role
        label: Role
        type: select
        required: true
        options:
          values:
            - { value: essential, label: "Essential" }
            - { value: complete-kit, label: "Complete kit" }
            - { value: researched-pick, label: "Researched pick" }
            - { value: affordable, label: "Affordable" }
            - { value: aesthetic-upgrade, label: "Aesthetic upgrade" }
            - { value: nice-to-have, label: "Nice to have" }
            - { value: later-upgrade, label: "Later upgrade" }
      - { name: isEssential, label: "Needed to start?", type: boolean }
      - { name: lead, label: "Preferred pick for its kit slot?", type: boolean }
      - { name: onlyOne, label: "The 'if you only buy one thing' pick?", type: boolean }
      - name: collections
        label: Shop collections it appears in
        type: select
        list: true
        options:
          values:
            - { value: pottery-era, label: "The Pottery Era" }
            - { value: creative-girl, label: "The Creative Girl" }
            - { value: sporty-girl, label: "Sporty Girl" }
            - { value: girls-night-in, label: "Girls' Night In" }
            - { value: bookish-girl, label: "Bookish Girl" }
            - { value: little-adventures, label: "Little Adventures" }
            - { value: journaling-era, label: "The Journaling Era" }
            - { value: cozy-after-hours, label: "Cozy After Hours" }
      - { name: hobbies, label: "Hobby pages it appears on (web-address names, one per line, e.g. junk-journaling)", type: string, list: true }
      - { name: articles, label: "Articles that show it as a shop pick (web-address names, one per line)", type: string, list: true }
      - name: kitSlots
        label: Starter-kit slots it fills
        type: object
        list: true
        fields:
          - name: kit
            label: Kit
            type: select
            options:
              values:
                - { value: junk-journaling, label: "Junk journaling" }
                - { value: watercolor, label: "Watercolor" }
                - { value: air-dry-clay, label: "Air-dry clay" }
                - { value: mahjong-night, label: "Mahjong night" }
                - { value: picnic, label: "Picnic" }
                - { value: reading-book-club, label: "Reading and book club" }
                - { value: pottery-paint-night, label: "Pottery and paint night" }
                - { value: racquet-sports, label: "Pickleball and tennis" }
          - { name: slot, label: "Slot name (as in the kit, e.g. washi-tape)", type: string }
      - name: specs
        label: Facts from the listing
        type: object
        list: true
        fields:
          - { name: label, label: "Label (e.g. Rolls)", type: string }
          - { name: value, label: "Value (e.g. 21)", type: string }
      - { name: researchSources, label: "Pages the facts were checked against (https, one per line)", type: string, list: true, required: true }
      - name: image
        label: Product picture (optional)
        type: object
        description: "Shown on the product's cards whenever rights are Cleared, whether Amazon tracking is on or off. NEVER save or paste an Amazon listing picture. Use a picture the maker or a photographer has given you written commercial permission to use on this site, or your own photo. Leave empty to show the label tile."
        fields:
          - { name: file, label: "Picture (upload; saved under /uploads)", type: image }
          - { name: alt, label: "Describe the picture for people who cannot see it", type: string }
          - { name: source, label: "Where it came from (maker's media kit, photographer, my own photo...)", type: string }
          - { name: license, label: "The commercial permission that lets this site use it (what was agreed, and when)", type: string }
          - { name: attribution, label: "Credit line shown with it (e.g. Photo: Brand media kit)", type: string }
          - name: rights
            label: Rights status
            type: select
            options:
              values:
                - { value: pending, label: "Pending (not shown)" }
                - { value: cleared, label: "Cleared (shown)" }
                - { value: rejected, label: "Rejected (not shown)" }
          - { name: note, label: "How to replace it if the permission ends (private)", type: string }

  # Not offered in the CMS yet: Hobbies (still code in src/data/hobbies.ts). The CSV importer
  # (scripts/import-products.mjs) is a developer bulk-load tool only. See docs/buyer/PRODUCT-MANAGEMENT.md.
