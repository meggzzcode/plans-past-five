<!doctype html><html><head><meta charset="utf-8"><title>Pinterest board cover 1000x1000</title><link rel="stylesheet" href="brand.css">
<style>body{width:1000px;height:1000px;--bg:var(--strawberry);--fgc:var(--ink);--acc:var(--cherry);background:var(--bg);color:var(--fgc)}.disp em{color:var(--acc)}
.t{left:70px;right:70px;top:290px;height:420px;font-size:130px}
.k{left:0;right:0;top:130px;text-align:center;font-size:24px;color:var(--acc)}
.ring{position:absolute;inset:34px;border:4px solid var(--acc);border-radius:36px}
.sub{left:0;right:0;bottom:150px;text-align:center;font-size:46px;color:var(--acc)}</style></head><body>
<div class="ring"></div>
<div class="abs kicker k">Plans Past Five</div>
<div class="abs t"><div class="disp" id="t" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center"><span>Solo Date <em>Ideas</em></span></div></div>
<div class="abs hand sub" id="s">board</div>
<div class="gstrip" style="bottom:80px;height:20px;left:100px;right:100px"></div>
<script>const q=new URLSearchParams(location.search);
if(q.get("title")){const t=document.getElementById("t");t.innerHTML="<span>"+q.get("title").replace(/\*([^*]+)\*/g,"<em>$1</em>")+"</span>";let s=130;t.parentNode.style.fontSize=s+"px";while(t.firstChild.offsetHeight>400&&s>50){s-=4;t.parentNode.style.fontSize=s+"px"}}
if(q.get("bg")){const b=q.get("bg");document.body.style.setProperty("--bg","var(--"+b+")");if(b==="cherry"||b==="garden"){document.body.style.setProperty("--fgc","var(--cream)");document.body.style.setProperty("--acc","var(--butter)");}}
if(q.get("sub"))document.getElementById("s").textContent=q.get("sub");</script></body></html>
