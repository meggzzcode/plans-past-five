<!doctype html><html><head><meta charset="utf-8"><title>Social quote 1080x1080</title><link rel="stylesheet" href="brand.css">
<style>body{width:1080px;height:1080px;background:var(--butter)}.q{left:100px;right:100px;top:200px;font-size:104px;font-family:Fraunces;font-style:italic;font-weight:500;line-height:1.06;letter-spacing:-.025em}
.q em{font-weight:600;color:var(--cherry)}.mark{left:90px;top:20px;font-family:Fraunces;font-style:italic;font-size:300px;color:var(--cherry);line-height:1}</style></head><body>
<div class="abs mark">&ldquo;</div>
<div class="abs q" id="q">Sorry, I have <em>plans past five.</em></div>
<div class="wm abs" style="left:100px;bottom:80px;font-size:48px">plans past <i>five.</i></div>
<div class="gstrip" style="bottom:0;height:30px"></div>
<script>const q=new URLSearchParams(location.search);if(q.get("quote"))document.getElementById("q").innerHTML=q.get("quote").replace(/\*([^*]+)\*/g,"<em>$1</em>");</script></body></html>
