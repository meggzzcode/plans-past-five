<!doctype html><html><head><meta charset="utf-8"><title>Article hero (type only) 1600x900</title><link rel="stylesheet" href="../social/brand.css">
<style>body{width:1600px;height:900px;background:var(--butter)}.h{left:120px;right:300px;top:190px;font-size:112px}.k{left:120px;top:110px;font-size:24px;color:var(--cherry)}
.s{left:120px;right:400px;bottom:130px;font-size:36px;font-weight:500;line-height:1.3}</style></head><body>
<!-- Usage: ?title=...&kicker=...&sub=...&bg=strawberry|butter|sunday|matcha|cream -->
<div class="abs kicker k" id="k">The Journal</div><div class="abs disp h" id="h">A headline with <em>one italic idea</em></div><div class="abs s" id="s">Dek line goes here.</div>
<div class="deco" style="right:140px;top:120px;width:120px;height:120px"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5l2.3 7.2 7.2 2.3-7.2 2.3L12 20.5l-2.3-7.2L2.5 11l7.2-2.3z"/></svg></div>
<div class="wm abs" style="right:120px;bottom:70px;font-size:44px">plans past <i>five.</i></div><div class="gstrip" style="bottom:0;height:30px"></div>
<script>const q=new URLSearchParams(location.search);if(q.get("bg"))document.body.style.background="var(--"+q.get("bg")+")";
for(const [k,id] of [["title","h"],["kicker","k"],["sub","s"]])if(q.get(k))document.getElementById(id).innerHTML=q.get(k).replace(/\*([^*]+)\*/g,"<em>$1</em>");</script></body></html>
