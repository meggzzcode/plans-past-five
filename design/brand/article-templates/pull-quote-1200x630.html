<!doctype html><html><head><meta charset="utf-8"><title>Pull quote 1200x630</title><link rel="stylesheet" href="../social/brand.css">
<style>body{width:1200px;height:630px;background:var(--cherry);color:var(--cream)}.q{left:100px;right:100px;top:110px;font-size:84px;font-family:Fraunces;font-style:italic;font-weight:500;line-height:1.06;letter-spacing:-.02em}.q em{color:var(--butter)}</style></head><body>
<!-- Usage: ?quote=Some things are worth being a *beginner* at. -->
<div class="abs q" id="q">Your free time doesn't need <em>a performance review.</em></div>
<div class="wm abs" style="left:100px;bottom:60px;font-size:36px;color:var(--cream)">plans past <i>five.</i></div><div class="gstrip" style="bottom:0;height:24px"></div>
<script>const q=new URLSearchParams(location.search);if(q.get("quote"))document.getElementById("q").innerHTML=q.get("quote").replace(/\*([^*]+)\*/g,"<em>$1</em>");</script></body></html>
