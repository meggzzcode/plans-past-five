<html lang="en"><head><meta charset="utf-8"><title>36-weekend-planner-1-printable</title>

<body class="pin t-printable th-straw " data-pin="36-weekend-planner-1-printable">

<div class="pillwrap "><span class="pill kicker">Free printable</span></div>
<div class="h disp fit chk" data-max="100" data-min="48"><div>The Weekend Edit <em>Planner</em></div></div>
<div class="sheetback"></div>
<div class="sheet"><div class="st">The Weekend Edit</div><div class="ss">Saturday · Sunday</div><div class="grid"><div class="cell ">Plans</div><div class="cell fill">People</div><div class="cell ">Make</div><div class="cell ">New</div><div class="cell fill">Rest</div><div class="cell ">Remember</div></div></div>
<div class="badge" style="color:var(--butter)"><svg viewBox="0 0 64 64"><path fill="currentColor" d="M56.00 32.00 Q62.22 38.90 53.62 42.41 Q56.24 51.33 46.96 50.76 Q45.45 59.93 37.34 55.40 Q32.00 63.00 26.66 55.40 Q18.55 59.93 17.04 50.76 Q7.76 51.33 10.38 42.41 Q1.78 38.90 8.00 32.00 Q1.78 25.10 10.38 21.59 Q7.76 12.67 17.04 13.24 Q18.55 4.07 26.66 8.60 Q32.00 1.00 37.34 8.60 Q45.45 4.07 46.96 13.24 Q56.24 12.67 53.62 21.59 Q62.22 25.10 56.00 32.00Z"/></svg><span>Free</span></div>
<div class="note hand">give Saturday a storyline</div>

<div class="brand ">plans past <i>five.</i></div>
<script>
(function(){
  function over(el){
    var mh=+el.dataset.maxh;
    if(mh){var c=el.firstElementChild;return c.offsetHeight>mh||c.scrollWidth>el.clientWidth+1;}
    var single=el.children.length===1&&el.firstElementChild.tagName==='DIV';
    var h=single?el.firstElementChild.offsetHeight>el.clientHeight+1:el.scrollHeight>el.clientHeight+1;
    return h||el.scrollWidth>el.clientWidth+1;}
  window.__over=over;
  function fit(el){var max=+el.dataset.max||100,min=+el.dataset.min||24,s=max;el.style.fontSize=s+'px';
    while(over(el)&&s>min){s-=2;el.style.fontSize=s+'px';}
    el.dataset.size=s;if(el.dataset.maxh){el.dataset.fitH=el.firstElementChild.offsetHeight;el.style.height='auto';}}
  function run(){document.querySelectorAll('.fit').forEach(fit);document.body.dataset.fitted='1';}
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){requestAnimationFrame(run)});
})();
</script>
</body></html>
