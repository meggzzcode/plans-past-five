name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Fails if bun.lock is out of date with package.json.
      - run: bun install --frozen-lockfile
      # Validates content/ and rebuilds the generated files; fails with a plain-English list if content is wrong.
      - run: bun run content:build
      - run: bunx vitest run
      - run: bunx tsc --noEmit
      - run: bunx vite build
