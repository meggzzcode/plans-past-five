# Netlify build for Plans Past Five (verified locally 2026-11-19: NITRO_PRESET=netlify bun run build
# writes static files to dist/ and the server-rendering function to .netlify/functions-internal).
# The repo's default Nitro target is Cloudflare, so the preset is set here by environment variable.
[build]
  command = "bun install --frozen-lockfile && bun run build"
  publish = "dist"
  # DEPLOY BUDGET: the free plan has 300 credits a month and a production deploy costs 15 credits.
  # PUBLISH MODEL: saving in the CMS (or any push to main) does NOT build. A build runs only when the
  # latest commit message contains the marker [deploy], or when the owner presses Netlify's
  # Deploys > Trigger deploy > Deploy site. (Whether Trigger deploy honours this rule is confirmed
  # by the CMS test in docs/buyer/CMS-TEST-PLAN.md; if it shows "Skipped", edit RELEASES.md on
  # GitHub with a commit message ending in [deploy].) Exit 0 = skip, exit 1 = build.
  # Test the rule: bash scripts/check-netlify-ignore.sh
  ignore = "! git log -1 --pretty=%B HEAD | grep -q '\\[deploy\\]'"

[build.environment]
  NITRO_PRESET = "netlify"
